<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
<!-- Студия движения: иконки в стиле Cyclone Icons (сетка 24, поле 2 px, штрих 1.75, круглые концы, мотив вихря, currentColor). Автор: IT, 09.10.2026. -->
<symbol id="ms-play" viewBox="0 0 24 24"><title>Пуск</title><g class="cy-duo"><path d="M8 5.2v13.6l10.6-6.8z" fill="currentColor" opacity="0.16"/></g><g class="cy-line" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5.2v13.6l10.6-6.8z"/><path d="M5 9.2c-1.4 1.6-1.4 4 0 5.6"/></g></symbol>
<symbol id="ms-pause" viewBox="0 0 24 24"><title>Пауза</title><g class="cy-duo"><rect x="6.5" y="5" width="4" height="14" rx="1.4" fill="currentColor" opacity="0.16"/><rect x="13.5" y="5" width="4" height="14" rx="1.4" fill="currentColor" opacity="0.16"/></g><g class="cy-line" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="6.5" y="5" width="4" height="14" rx="1.4"/><rect x="13.5" y="5" width="4" height="14" rx="1.4"/></g></symbol>
<symbol id="ms-restart" viewBox="0 0 24 24"><title>Сначала</title><g class="cy-line" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5.2 9.5A7.5 7.5 0 1 1 6 15.8"/><path d="M4.8 4.8v4.9h4.9"/><path d="M12 12m-1.2 0a1.2 1.2 0 1 0 2.4 0a1.2 1.2 0 1 0-2.4 0" fill="currentColor" stroke="none"/></g></symbol>
<symbol id="ms-record" viewBox="0 0 24 24"><title>Запись ролика</title><g class="cy-duo"><circle cx="12" cy="12" r="9" fill="currentColor" opacity="0.12"/></g><g class="cy-line" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19.6 8.2A8.4 8.4 0 1 1 15.6 4.4"/><path d="M15.6 4.4c1.4.6 2.6 1.5 3.4 2.6"/><circle cx="12" cy="12" r="3.6" fill="currentColor" stroke="none"/></g></symbol>
<symbol id="ms-undo" viewBox="0 0 24 24"><title>Отменить</title><g class="cy-line" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6.5L4.5 11 9 15.5"/><path d="M4.8 11h9.4a5 5 0 0 1 0 10h-2.4"/></g></symbol>
<symbol id="ms-redo" viewBox="0 0 24 24"><title>Вернуть</title><g class="cy-line" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6.5l4.5 4.5-4.5 4.5"/><path d="M19.2 11H9.8a5 5 0 0 0 0 10h2.4"/></g></symbol>
<symbol id="ms-camera" viewBox="0 0 24 24"><title>Камера</title><g class="cy-duo"><rect x="3" y="7" width="13" height="10" rx="2.4" fill="currentColor" opacity="0.14"/></g><g class="cy-line" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="13" height="10" rx="2.4"/><path d="M16 10.5l5-2.5v8l-5-2.5"/><path d="M9.5 12m-1 0a1 1 0 1 0 2 0a2.3 2.3 0 1 0 -2.3 2.3"/></g></symbol>
<symbol id="ms-orbit" viewBox="0 0 24 24"><title>Свободная камера</title><g class="cy-duo"><circle cx="12" cy="12" r="3.4" fill="currentColor" opacity="0.16"/></g><g class="cy-line" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.4"/><path d="M20.5 9.6C21.6 12 18 15.4 12.6 17.4S2.8 19.2 2.2 16.6C1.7 14.5 4.4 11.6 8.6 9.6"/><path d="M15.8 6.9c2.3-.6 4.2-.4 4.7.8"/></g></symbol>
<symbol id="ms-path" viewBox="0 0 24 24"><title>Путь</title><g class="cy-line" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 18.5c2-6 5-1 7-6.5s5-5 7-6.5"/><circle cx="5" cy="18.5" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="19" cy="5.5" r="1.8" fill="currentColor"/></g></symbol>
<symbol id="ms-send" viewBox="0 0 24 24"><title>Применить</title><g class="cy-duo"><path d="M4 12l16-7.5L15 20l-3.2-5.6z" fill="currentColor" opacity="0.14"/></g><g class="cy-line" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-7.5L15 20l-3.2-5.6z"/><path d="M11.8 14.4L20 4.5"/></g></symbol>
<symbol id="ms-download" viewBox="0 0 24 24"><title>Скачать</title><g class="cy-line" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7.5 10.8L12 15.3l4.5-4.5"/><path d="M4.5 16.5v1.8a1.7 1.7 0 0 0 1.7 1.7h11.6a1.7 1.7 0 0 0 1.7-1.7v-1.8"/></g></symbol>
<symbol id="ms-upload" viewBox="0 0 24 24"><title>Загрузить</title><g class="cy-line" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15.5V4.5"/><path d="M7.5 9L12 4.5 16.5 9"/><path d="M4.5 16.5v1.8a1.7 1.7 0 0 0 1.7 1.7h11.6a1.7 1.7 0 0 0 1.7-1.7v-1.8"/></g></symbol>
<symbol id="ms-key" viewBox="0 0 24 24"><title>Ключевой кадр</title><g class="cy-duo"><path d="M12 3.5l8.5 8.5-8.5 8.5L3.5 12z" fill="currentColor" opacity="0.16"/></g><g class="cy-line" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l8.5 8.5-8.5 8.5L3.5 12z"/><path d="M12 12m-1 0a1 1 0 1 0 2 0"/></g></symbol>
<symbol id="ms-trash" viewBox="0 0 24 24"><title>Удалить</title><g class="cy-line" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 7h15"/><path d="M9.5 7V4.8h5V7"/><path d="M6.5 7l1 12.2a1.6 1.6 0 0 0 1.6 1.5h5.8a1.6 1.6 0 0 0 1.6-1.5l1-12.2"/><path d="M10.5 11v5.5M13.5 11v5.5"/></g></symbol>
<symbol id="ms-plus" viewBox="0 0 24 24"><title>Добавить</title><g class="cy-line" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></g></symbol>
</svg>
